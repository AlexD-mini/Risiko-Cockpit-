# Ablageort im Repository: .github/workflows/cockpit.yml
name: Risiko-Cockpit
concurrency:
  group: cockpit
on:
  schedule:
    - cron: "30 6 * * 1-5"   # werktags 06:30 UTC = 08:30 deutscher Zeit
  workflow_dispatch: {}
 
permissions:
  contents: write      # index.html, history.csv, alarm_state.json zurückschreiben
  issues: write        # Alarm-Issue anlegen (löst Push der GitHub-App aus)
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas==2.2.3
      - run: python cockpit.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TD_API_KEY: ${{ secrets.TD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Ergebnis committen
        run: |
          git config user.name "cockpit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html history.csv alarm_state.json
          git diff --cached --quiet || git commit -m "Cockpit-Update $(date -u +%F)"
          git push
 
