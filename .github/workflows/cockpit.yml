name: Risiko-Cockpit
on:
  schedule:
    - cron: "30 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas==2.2.3
      - run: python cockpit.py
      - name: Ergebnis committen
        run: |
          git config user.name "cockpit-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Cockpit-Update"
          git push
